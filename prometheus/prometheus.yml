global:
  scrape_interval: 5s

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "litellm"
    metrics_path: /metrics/
    static_configs:
      - targets: ["litellm:4000"]
  - job_name: "semantic-cache"
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi:8000"]