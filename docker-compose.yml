services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
    depends_on:
      - postgres
    command:
      - "--config"
      - "/app/config.yaml"
    networks:
      - app-network

  postgres:
    image: pgvector/pgvector:pg17
    container_name: litellm-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CACHE_POSTGRES_DB: ${CACHE_POSTGRES_DB}
      CACHE_POSTGRES_USER: ${CACHE_POSTGRES_USER}
      CACHE_POSTGRES_PASSWORD: ${CACHE_POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-cache-db.sh:/docker-entrypoint-initdb.d/init-cache-db.sh
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - app-network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      - app-network

  ollama:
    cpus: "8"
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-network

  presidio-analyzer:
    build:
      context: ./semantic_caching/presidio_analyzer
      dockerfile: Dockerfile
    container_name: presidio-analyzer
    ports:
      - "5002:3000"
    volumes:
      - ./custom_recognizers:/app/custom-rules
    networks:
      - app-network
    environment:
      CUSTOM_RULES_DIR: /app/custom-rules

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    ports:
      - "5001:3000"
    networks:
      - app-network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app
    security_opt:
      - no-new-privileges:false
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_HOST: http://ollama:11434
      ANALYZER_URL: http://presidio-analyzer:3000/analyze
      ANONYMIZER_URL: http://presidio-anonymizer:3000/anonymize
      CUSTOM_RULES_DIR: /app/custom-rules
      API_KEY: ${API_KEY}
      MODEL_NAME: ${MODEL_NAME}
      API_KEY_EMB: ${API_KEY_EMB}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      CACHE_POSTGRES_HOST: postgres
      CACHE_POSTGRES_PORT: 5432
      CACHE_POSTGRES_DB: ${CACHE_POSTGRES_DB}
      CACHE_POSTGRES_USER: ${CACHE_POSTGRES_USER}
      CACHE_POSTGRES_PASSWORD: ${CACHE_POSTGRES_PASSWORD}
      EMBEDDING_MODEL_DIMENSION: ${EMBEDDING_MODEL_DIMENSION}
    depends_on:
      - redis
      - ollama
      - presidio-analyzer
      - presidio-anonymizer
    volumes:
      - .:/app
      - ./custom_recognizers:/app/custom-rules
    networks:
      - app-network
    command: ["uvicorn", "API.app:app", "--host", "0.0.0.0", "--port", "8000"]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - postgres
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - app-network

volumes:
  ollama:
  presidio-rules:
  postgres_data:
  pgadmin_data:
  grafana_data:
  prometheus_data:

networks:
  app-network:
    driver: bridge