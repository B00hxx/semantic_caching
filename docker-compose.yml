services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6380:6379"
    networks:
      - app-network
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - app-network

  presidio-analyzer:
    build:
      context: ./semantic_caching/presidio-analyzer
      dockerfile: Dockerfile
    container_name: presidio-analyzer
    ports:
      - "5002:3000"
    volumes:
      - ./custom_recognizers:/app/custom-rules
    networks:
      - app-network
    environment:
      CUSTOM_RULES_DIR: /app/custom-rules

  presidio-anonymizer:
    image: ghcr.io/data-privacy-stack/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    ports:
      - "5001:3000"
    networks:
      - app-network

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-app
    security_opt:
      - no-new-privileges:false
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_HOST: http://ollama:11434
      ANALYZER_URL: http://presidio-analyzer:3000/analyze
      ANONYMIZER_URL: http://presidio-anonymizer:3000/anonymize
      CUSTOM_RULES_DIR: /app/custom-rules
    depends_on:
      - redis
      - ollama
      - presidio-analyzer
      - presidio-anonymizer
    volumes:
      - .:/app
      - ./custom_recognizers:/app/custom-rules
    networks:
      - app-network
    command: ["uvicorn", "API.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  ollama:
  presidio-rules:

networks:
  app-network:
    driver: bridge